<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lokman Visuals</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23111'/%3E%3Ccircle cx='16' cy='16' r='7' fill='%23f6c90e'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/styles.css" />
  <script type="module" src="/vendor/player/hyperframes-player.js"></script>
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-dot"></span>
      <span class="brand-name">Lokman Visuals</span>
      <span class="brand-tag">Atelier de revue</span>
    </div>
    <div class="pickers">
      <label class="pick"><span>Projet</span><select id="projectSelect" aria-label="Projet"></select></label>
      <label class="pick"><span>Version</span><select id="versionSelect" aria-label="Version du rendu"></select></label>
    </div>
    <button id="refreshBtn" class="btn" title="Relire les projets et les rendus">Actualiser</button>
  </header>

  <main class="layout">
    <section class="viewer">
      <div class="stage" id="stage">
        <div class="stage-top">
          <span id="versionBadge" class="vbadge"></span>
          <span class="spacer"></span>
          <button id="loopBtn" class="pill" title="Lire la sélection en boucle (L)">Boucle sélection</button>
          <button id="fullscreenBtn" class="pill" title="Plein écran (F)">Plein écran</button>
        </div>
        <div class="screen" id="screen">
          <div class="screen-empty" id="screenEmpty">Choisis un projet et une version.</div>
        </div>
        <div class="scrub" id="scrub"><div class="scrub-sel" id="scrubSel"></div><div class="scrub-fill" id="scrubFill"></div><div class="scrub-knob" id="scrubKnob"></div></div>
        <div class="transport">
          <button class="tbtn" data-step="-1s" title="Reculer d'1 s (Maj+←)">−1s</button>
          <button class="tbtn" data-step="-1f" title="Image précédente (←)">−1 img</button>
          <button class="tbtn play" id="playBtn" title="Lecture / pause (Espace)"><svg viewBox="0 0 24 24" width="18" height="18"><path id="playIcon" d="M7 4l13 8-13 8z" fill="currentColor"/></svg></button>
          <button class="tbtn" data-step="+1f" title="Image suivante (→)">+1 img</button>
          <button class="tbtn" data-step="+1s" title="Avancer d'1 s (Maj+→)">+1s</button>
          <div class="timecode" id="timecode">00:00.00 · f000</div>
          <div class="speeds" id="speeds">
            <button data-rate="0.5">0,5×</button><button data-rate="1" class="on">1×</button><button data-rate="1.25">1,25×</button><button data-rate="1.5">1,5×</button><button data-rate="2">2×</button>
          </div>
        </div>
        <div class="hint" id="hint"></div>
      </div>

      <div id="banners"></div>

      <div class="card timeline-card">
        <div class="tl-toolbar">
          <strong>Timeline</strong>
          <span class="tl-sel" id="selInfo"></span>
          <span class="spacer"></span>
          <span class="tl-warn" id="tlWarn"></span>
          <button class="mini" id="zoomOut" title="Dézoomer">−</button>
          <input type="range" id="zoom" min="0" max="100" value="0" aria-label="Zoom de la timeline" />
          <button class="mini" id="zoomIn" title="Zoomer">+</button>
          <button class="mini" id="zoomFit" title="Ajuster à la largeur">Ajuster</button>
        </div>
        <div class="tl" id="timeline"></div>
      </div>
    </section>

    <aside class="side card">
      <nav class="tabs">
        <button data-tab="retours" class="on">Retours <span id="annCount" class="count"></span></button>
        <button data-tab="montage">Montage MP4 <span id="cutCount" class="count"></span></button>
      </nav>

      <div class="tab-panel" id="panel-retours">
        <div class="composer">
          <div class="composer-target">
            <span id="targetLabel" class="target-pill"></span>
            <span class="spacer"></span>
            <button class="link" id="clearSel" title="Échap">Instant au curseur</button>
          </div>
          <div class="chips" id="targetChips"></div>
          <div class="composer-row">
            <textarea id="commentInput" rows="2" placeholder="Ton retour sur cette frame… (Entrée pour ajouter, Maj+Entrée = retour à la ligne)"></textarea>
            <button class="btn primary" id="addBtn">Ajouter</button>
          </div>
        </div>
        <div class="filters">
          <div class="seg" id="statusFilter">
            <button data-f="open" class="on">Ouverts</button><button data-f="a_traiter">À traiter</button><button data-f="a_verifier">À vérifier</button><button data-f="valide">Validés</button><button data-f="all">Tous</button>
          </div>
          <label class="check"><input type="checkbox" id="allVersions" /> Toutes versions</label>
        </div>
        <ul class="ann-list" id="annList"></ul>
      </div>

      <div class="tab-panel hidden" id="panel-montage"></div>
      <div class="export-bar">
        <button class="btn" id="copyClaude">Copier pour Claude</button>
        <button class="btn" id="exportJson">Exporter les annotations en JSON</button>
      </div>
    </aside>
  </main>

  <div id="toasts" aria-live="polite"></div>
  <dialog id="dialog"></dialog>
</body>
</html>
